<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e2235"/>
      <stop offset="100%" stop-color="#0b0d14"/>
    </radialGradient>
    <linearGradient id="beamGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ffcc00" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="torchBody" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="metalBevel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="torchGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bgGrad)" stroke="#f59e0b" stroke-width="8"/>

  <!-- Light Beam Radiating Upward -->
  <polygon points="200,170 120,40 392,40 312,170" fill="url(#beamGrad)" opacity="0.85"/>

  <!-- Flashlight Head Bezel -->
  <polygon points="180,180 332,180 300,240 212,240" fill="url(#torchBody)" filter="url(#torchGlow)"/>
  <ellipse cx="256" cy="180" rx="76" ry="16" fill="url(#metalBevel)"/>
  <ellipse cx="256" cy="178" rx="66" ry="12" fill="#fffbeb"/>

  <!-- Neck -->
  <rect x="220" y="240" width="72" height="30" rx="4" fill="url(#metalBevel)"/>

  <!-- Flashlight Handle -->
  <rect x="214" y="270" width="84" height="150" rx="8" fill="url(#torchBody)"/>
  <!-- Grip Rings -->
  <line x1="214" y1="295" x2="298" y2="295" stroke="#b45309" stroke-width="4"/>
  <line x1="214" y1="315" x2="298" y2="315" stroke="#b45309" stroke-width="4"/>
  <line x1="214" y1="335" x2="298" y2="335" stroke="#b45309" stroke-width="4"/>
  <line x1="214" y1="355" x2="298" y2="355" stroke="#b45309" stroke-width="4"/>
  <line x1="214" y1="375" x2="298" y2="375" stroke="#b45309" stroke-width="4"/>
  <line x1="214" y1="395" x2="298" y2="395" stroke="#b45309" stroke-width="4"/>

  <!-- Tactical Switch Button -->
  <rect x="242" y="325" width="28" height="38" rx="6" fill="#1e293b" stroke="#f59e0b" stroke-width="3"/>
  <circle cx="256" cy="344" r="7" fill="#ef4444"/>

  <!-- Tail Cap -->
  <rect x="210" y="420" width="92" height="24" rx="6" fill="url(#metalBevel)"/>

  <!-- Star Rays -->
  <line x1="256" y1="40" x2="256" y2="15" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
  <line x1="170" y1="65" x2="150" y2="45" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
  <line x1="342" y1="65" x2="362" y2="45" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
</svg>
